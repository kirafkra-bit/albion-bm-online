<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Albion Calculator</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="auth-page">
  <div class="auth-loading" id="authLoading" role="status" aria-live="polite">
    <div class="loading-spinner"></div>
    <span>Connecting securely...</span>
  </div>
  <main class="auth-shell">
    <section class="auth-card" id="authCard" aria-labelledby="loginTitle">
      <a class="auth-brand" href="index.html" aria-label="Albion Calculator home">
        <span>Blackmarket Albion Crafting Calculator</span>
      </a>
      <div class="auth-heading">
        <p class="auth-eyebrow">BLACK MARKET TOOLS</p>
        <h1 id="loginTitle">Welcome back</h1>
        <p>Sign in to access your crafting history.</p>
      </div>

      <form id="loginForm" novalidate>
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email" inputmode="email" spellcheck="false">

        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password">
        <a class="auth-forgot" href="#" id="forgotPassword">Forgot password?</a>

        <button class="auth-primary" type="submit" id="loginButton">Log in</button>
        <p id="message" class="auth-message" role="alert" aria-live="polite"></p>
      </form>

      <div class="auth-divider"><span>or continue with</span></div>

      <button class="auth-google" id="googleButton" type="button">
        <span class="google-mark" aria-hidden="true">G</span>
        Sign in with Google
      </button>

      <p class="auth-switch">New here? <a class="auth-transition-link" href="register.html">Create an account</a></p>
      <p class="auth-security"><span aria-hidden="true">Secure</span> Your account is protected by Firebase Authentication.</p>
    </section>
  </main>

  <script>
    window.firebaseReady = new Promise(resolve => {
      window.resolveFirebaseReady = resolve;
    });
  </script>
  <script type="module" src="assets/firebase.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const googleButton = document.getElementById("googleButton");
    const message = document.getElementById("message");
    const authCard = document.getElementById("authCard");
    const authLoading = document.getElementById("authLoading");
    const forgotPassword = document.getElementById("forgotPassword");
    const authTransitionLink = document.querySelector(".auth-transition-link");

    function showMessage(text) {
    message.textContent = text;
    }

    function authErrorMessage(error) {
    if (error.code === "auth/invalid-credential" ||
        error.code === "auth/user-disabled") {
      return "The email or password is incorrect.";
    }
    if (error.code === "auth/too-many-requests") {
      return "Too many attempts. Please wait a moment and try again.";
    }
    if (error.code === "auth/popup-closed-by-user") {
      return "Google sign-in was cancelled.";
    }
    return "Unable to sign in. Please check your details and try again.";
    }

    async function waitForFirebase() {
    await window.firebaseReady;
    if (!window.fbEmailSignIn || !window.fbSignIn) {
      throw new Error("Authentication is unavailable.");
    }
    }

    function startAuthTransition(button) {
      authCard.classList.add("is-flipping");
      button.classList.add("is-loading");
      button.setAttribute("aria-busy", "true");
      button.disabled = true;
      authLoading.classList.add("is-visible");
      authLoading.classList.add("is-action");
      authLoading.querySelector("span").textContent = "Signing you in...";
    }

    function stopAuthTransition(button) {
      authCard.classList.remove("is-flipping");
      button.classList.remove("is-loading");
      button.removeAttribute("aria-busy");
      button.disabled = false;
      authLoading.classList.remove("is-visible");
      authLoading.classList.remove("is-action");
    }

    function pauseForFlip() {
      return new Promise(resolve => setTimeout(resolve, 560));
    }

    authTransitionLink.addEventListener("click", event => {
      event.preventDefault();
      authCard.classList.add("is-flipping");
      authLoading.classList.add("is-visible", "is-action");
      authLoading.querySelector("span").textContent = "Opening registration...";
      setTimeout(() => {
        window.location.href = authTransitionLink.href;
      }, 560);
    });

    form.addEventListener("submit", async event => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!form.reportValidity()) return;

    startAuthTransition(loginButton);
    showMessage("");
    try {
    await pauseForFlip();
    await waitForFirebase();
      await window.fbEmailSignIn(email, password);
      window.location.href = "index.html";
    } catch (error) {
      showMessage(authErrorMessage(error));
    } finally {
      stopAuthTransition(loginButton);
    }
    });

    googleButton.addEventListener("click", async () => {
    startAuthTransition(googleButton);
    showMessage("");
    try {
      await pauseForFlip();
      await waitForFirebase();
      await window.fbSignIn();
      window.location.href = "index.html";
    } catch (error) {
      showMessage(authErrorMessage(error));
    } finally {
      stopAuthTransition(googleButton);
    }
    });

    forgotPassword.addEventListener("click", async event => {
      event.preventDefault();
      const email = document.getElementById("email").value.trim();
      if (!email || !document.getElementById("email").checkValidity()) {
        showMessage("Enter your email address first, then try again.");
        document.getElementById("email").focus();
        return;
      }
      authLoading.classList.add("is-visible");
      authLoading.querySelector("span").textContent = "Sending reset email...";
      try {
        await waitForFirebase();
        await window.fbResetPassword(email);
        showMessage("If an account exists for that email, a reset link has been sent.");
      } catch (error) {
        showMessage("Unable to send a reset link. Please try again.");
      } finally {
        authLoading.classList.remove("is-visible");
      }
    });

    window.firebaseReady.then(() => {
    authLoading.classList.remove("is-visible");
    window.onAuthStateChanged(user => {
      if (user) window.location.replace("index.html");
    });
    });
  </script>
</body>
</html>
