<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Albion Calculator</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="loginTitle">
      <a class="auth-brand" href="index.html" aria-label="Albion Calculator home">
        <span class="auth-brand-mark">A</span>
        <span>Albion Calculator</span>
      </a>
      <div class="auth-heading">
        <p class="auth-eyebrow">BLACK MARKET TOOLS</p>
        <h1 id="loginTitle">Welcome back</h1>
        <p>Sign in to access your crafting history.</p>
      </div>

      <form id="loginForm" novalidate>
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email" inputmode="email" spellcheck="false">

        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password">

        <button class="auth-primary" type="submit" id="loginButton">Log in</button>
        <p id="message" class="auth-message" role="alert" aria-live="polite"></p>
      </form>

      <div class="auth-divider"><span>or continue with</span></div>

      <button class="auth-google" id="googleButton" type="button">
        <span class="google-mark" aria-hidden="true">G</span>
        Sign in with Google
      </button>

      <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
      <p class="auth-security"><span aria-hidden="true">Secure</span> Your account is protected by Firebase Authentication.</p>
    </section>
  </main>

  <script>
    window.firebaseReady = new Promise(resolve => {
      window.resolveFirebaseReady = resolve;
    });
  </script>
  <script type="module" src="assets/firebase.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const googleButton = document.getElementById("googleButton");
    const message = document.getElementById("message");

    function showMessage(text) {
    message.textContent = text;
    }

    function authErrorMessage(error) {
    if (error.code === "auth/invalid-credential" ||
        error.code === "auth/user-disabled") {
      return "The email or password is incorrect.";
    }
    if (error.code === "auth/too-many-requests") {
      return "Too many attempts. Please wait a moment and try again.";
    }
    if (error.code === "auth/popup-closed-by-user") {
      return "Google sign-in was cancelled.";
    }
    return "Unable to sign in. Please check your details and try again.";
    }

    async function waitForFirebase() {
    await window.firebaseReady;
    if (!window.fbEmailSignIn || !window.fbSignIn) {
      throw new Error("Authentication is unavailable.");
    }
    }

    form.addEventListener("submit", async event => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!form.reportValidity()) return;

    loginButton.disabled = true;
    showMessage("");
    try {
      await waitForFirebase();
      await window.fbEmailSignIn(email, password);
      window.location.href = "index.html";
    } catch (error) {
      showMessage(authErrorMessage(error));
    } finally {
      loginButton.disabled = false;
    }
    });

    googleButton.addEventListener("click", async () => {
    googleButton.disabled = true;
    showMessage("");
    try {
      await waitForFirebase();
      await window.fbSignIn();
      window.location.href = "index.html";
    } catch (error) {
      showMessage(authErrorMessage(error));
    } finally {
      googleButton.disabled = false;
    }
    });

    window.firebaseReady.then(() => {
    window.onAuthStateChanged(user => {
      if (user) window.location.replace("index.html");
    });
    });
  </script>
</body>
</html>
